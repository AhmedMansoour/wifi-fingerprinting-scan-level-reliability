name: Python reproducibility, privacy and Android build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  python-and-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/assemble_synthetic_combined.py
      - run: python -m pytest -q
      - run: python scripts/check_public_release.py
      - run: python scripts/reproduce_release.py --mode demo
      - run: python scripts/validate_synthetic_combined.py
  android-gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify Android unit tests and build
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
