name: Python reproducibility, privacy and Android build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  python-and-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/assemble_synthetic_combined.py
      - run: python scripts/refresh_release_manifest.py --check
      - run: python -m pytest -q
      - run: python scripts/check_public_release.py
      - run: python scripts/validate_hk_empirical.py
      - run: python scripts/reproduce_release.py --mode hk-u09
      - run: python scripts/reproduce_release.py --mode demo
      - run: python scripts/validate_synthetic_combined.py
  android-gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK 35 with preinstalled command-line tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Verify Android unit tests and build
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
