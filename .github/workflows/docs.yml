name: Documentation site
on:
  push:
    branches: [main, release/docs-site-option-b-20261021, release/measured-interactive-explorer-20261021, release/indicator-atlas-expert-20261021]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: docs-site
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Build documentation
        run: python -m mkdocs build --clean --strict
      - name: Check generated pages and search index
        run: |
          python - <<'PYTEST'
          from pathlib import Path
          base = Path('_site')
          must = ['index.html', 'search/search_index.json', 'learn/overview/index.html',
                  'learn/walkthrough/index.html', 'start/quickstart/index.html',
                  'start/your-data/index.html', 'results/how-to-read/index.html',
                  'results/evidence/index.html', 'help/faq/index.html',
                  'learn/interactive-explorer/index.html', 'assets/interactive/index.html',
                  'assets/interactive/sample_scans.json', 'assets/interactive/explorer.js',
                  'learn/indicator-atlas/index.html', 'INDICATORS/index.html',
                  'assets/indicator-atlas/index.html', 'assets/indicator-atlas/atlas.js',
                  'assets/indicator-atlas/indicators.json', 'assets/indicator-atlas/composites.json']
          missing = [p for p in must if not (base / p).is_file()]
          if missing:
              raise SystemExit('Missing generated site files: ' + ', '.join(missing))
          print('Built site checks passed: ', len(must), 'files')
          PYTEST
      - name: Publish gh-pages branch (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m mkdocs gh-deploy --force --clean --remote-branch gh-pages
