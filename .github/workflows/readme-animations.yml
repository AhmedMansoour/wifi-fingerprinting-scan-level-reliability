name: Generate README animated previews
on:
  push:
    branches: [main]
    paths:
      - scripts/generate_readme_animated_previews.py
      - .github/workflows/readme-animations.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image-only dependencies
        run: python -m pip install "Pillow==12.3.0" "CairoSVG==2.8.2"
      - name: Render, hash-pin, and inventory the approved GIFs
        run: python scripts/generate_readme_animated_previews.py --publish
      - name: Commit generated public documentation assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "Publish data-derived animated GIFs in README"
            git push origin HEAD:main
          fi
