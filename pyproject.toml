[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-integrity"
version = "1.0.0rc1"
description = "Reproducible scan-level reliability assessment for Wi-Fi fingerprinting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "PyYAML>=6",
  "typer>=0.9",
  "rich>=13"
]

[project.optional-dependencies]
catboost = ["catboost>=1.2"]
transformer = ["torch>=2.2"]
cnn = ["tensorflow>=2.16"]
parquet = ["pyarrow>=14"]
dev = ["pytest>=8"]

[project.scripts]
wifi-integrity = "wifi_integrity.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[project.urls]
Documentation = "https://github.com/AhmedMansoour/wifi-fingerprinting-scan-level-reliability/tree/main/docs"
Repository = "https://github.com/AhmedMansoour/wifi-fingerprinting-scan-level-reliability"
Issues = "https://github.com/AhmedMansoour/wifi-fingerprinting-scan-level-reliability/issues"

[tool.coverage.run]
source = ["wifi_integrity"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 70
