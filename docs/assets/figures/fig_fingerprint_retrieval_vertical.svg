<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1575" viewBox="0 0 900 1575" role="img" aria-labelledby="svgtitle svgdesc">
<title id="svgtitle">Fingerprint retrieval, position estimation, and scan-level reliability inference</title>
<desc id="svgdesc">Vertical computational architecture showing query Wi-Fi measurements and training radio map entering fingerprint retrieval, parallel estimator and diagnostic candidate branches, fifteen diagnostic quantities, three composite scores, and downstream evidence interpretation.</desc>
<defs>
  <marker id="arrowN" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#52677a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowB" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#4176a4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowA" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#a47b48" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="900" height="1575" fill="#ffffff"/>

